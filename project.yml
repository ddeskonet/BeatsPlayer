name: BeatsPlayer
options:
  bundleIdPrefix: com.ddeskonet
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: NO
targets:
  BeatsPlayer:
    type: application
    platform: iOS
    sources:
      - path: BeatsPlayer
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Beats Player
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ddeskonet.beatsplayer
        TARGETED_DEVICE_FAMILY: "1"
